version: "3.9"

networks:
  logrouter-net:
    name: logrouter-net
    driver: bridge

volumes:
  ollama_data:
  postgres_data:

services:
  ollama:
    image: ollama/ollama:latest
    container_name: logrouter-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-4}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-3}
    networks:
      - logrouter-net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: logrouter-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-logrouter}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-logrouter_pass}
      - POSTGRES_DB=${POSTGRES_DB:-logrouter_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - logrouter-net

  app:
    build:
      context: .
    container_name: logrouter-app
    restart: "no"
    depends_on:
      - postgres
      - ollama
    environment:
      - POSTGRES_HOST=postgres
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - .:/app
    networks:
      - logrouter-net
