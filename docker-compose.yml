# LogRouter Evaluation Dataset - Phase 0 Docker environment (Section 5)
# Run with: docker compose up --build
#   1) The loghub service fetches the LogHub 2k files from the pinned commit
#      in corpus_manifest.json into the shared 'loghub-corpus' volume AND
#      serves them from its own Postgres (+pgvector) server (a `lines` table),
#      so datasetgen queries the corpus with real SQL. Readiness (HEALTHCHECK)
#      requires both the fetch to be done and Postgres to accept connections.
#   2) The datasetgen service starts once loghub reports healthy; it reaches
#      loghub's Postgres over datasetgen-net (POSTGRES_* env vars, not
#      exposed to the host) via datasetgen/pg_client.py. /data/loghub is
#      still mounted read-only too (medium/hard generation still reads the
#      raw files directly; only the easy-tier count/presence path and
#      schema_validator's checks go through Postgres). It stays up (tail -f)
#      so pipeline steps can be run with `docker compose exec datasetgen ...`.
#   3) Manual SQL spot-checks of output/pilot/questions.json (see
#      sql_verification/verify.sql) run directly against loghub's own
#      Postgres -- there is no separate verification database.

networks:
  datasetgen-net:
    driver: bridge

volumes:
  loghub-corpus:
  loghub-pgdata:

services:
  loghub:
    build:
      context: ./loghub
    container_name: loghub
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loghub}
      POSTGRES_USER: ${POSTGRES_USER:-loghub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    networks:
      - datasetgen-net
    expose:
      - "5432"
    volumes:
      - loghub-corpus:/data/loghub
      - loghub-pgdata:/var/lib/postgresql/data

  datasetgen:
    build:
      context: ./datasetgen
    container_name: datasetgen
    depends_on:
      loghub:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://10.15.33.66:11435}
      PGHOST: loghub
      PGPORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-loghub}
      POSTGRES_USER: ${POSTGRES_USER:-loghub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    networks:
      - datasetgen-net
    volumes:
      - loghub-corpus:/data/loghub:ro
      - ./output:/output
      - ./scale_config.yaml:/app/scale_config.yaml:ro
      - ./datasetgen:/app
    command: ["tail", "-f", "/dev/null"]
