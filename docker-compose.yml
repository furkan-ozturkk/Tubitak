networks:
  logrouter-net:
    name: logrouter-net
    driver: bridge

volumes:
  postgres_data:

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: logrouter-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-logrouter}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-logrouter_pass}
      - POSTGRES_DB=${POSTGRES_DB:-logrouter_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - logrouter-net

  app:
    build:
      context: .
    container_name: t-bitak-app
    restart: unless-stopped
    command: sleep infinity
    depends_on:
      - postgres
    environment:
      - POSTGRES_HOST=postgres
      - OLLAMA_HOST=${OLLAMA_HOST}
      - INGEST_DATASET=${INGEST_DATASET:-HDFS}
    volumes:
      - .:/app
    networks:
      - logrouter-net
    develop:
      watch:
        - action: rebuild
          path: requirements.txt
        - action: rebuild
          path: Dockerfile
        - action: sync+restart
          path: .
          target: /app
          ignore:
            - .git/
            - "**/__pycache__/"
            - "*.pyc"
